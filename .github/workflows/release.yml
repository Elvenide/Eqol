name: Automated Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Extract Eqol version from Scripts/core.lua
        id: version
        run: |
          VERSION=$(grep -oP 'Core\.VERSION\s*=\s*"\K[^"]+' Scripts/core.lua | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract Core.VERSION from Scripts/core.lua" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; skipping release creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Conventional Commits changelog
        id: changelog
        if: steps.version.outputs.exists == 'false'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.version.outputs.tag }} --strip all
        env:
          OUTPUT: CHANGELOG_RELEASE.md

      - name: Package Eqol mod zips
        if: steps.version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # 1. Direct UE4SS zip (Eqol/)
          UE4SS_STAGE="dist-ue4ss/Eqol"
          mkdir -p "${UE4SS_STAGE}"
          cp -r Scripts "${UE4SS_STAGE}/Scripts"
          cp README.md "${UE4SS_STAGE}/README.md"
          if [ -d docs ]; then
            mkdir -p "${UE4SS_STAGE}/docs"
            cp docs/*.md "${UE4SS_STAGE}/docs/" || true
          fi
          touch "${UE4SS_STAGE}/enabled.txt"
          (cd dist-ue4ss && zip -r "../Eqol-v${VERSION}-UE4SS.zip" Eqol)

          # 2. MSCoreManager zip (Mods/Eqol/ + mscore.mod)
          MSCORE_STAGE="dist-mscore/Mods/Eqol"
          mkdir -p "${MSCORE_STAGE}"
          cp -r "${UE4SS_STAGE}/." "${MSCORE_STAGE}/"
          cat > "${MSCORE_STAGE}/mscore.mod" <<EOF
          name=Eqol
          repo=${{ github.repository }}
          version=${VERSION}
          EOF
          (cd dist-mscore && zip -r "../Eqol-v${VERSION}-MSCoreManager.zip" Mods)

          ls -lh "Eqol-v${VERSION}-MSCoreManager.zip" "Eqol-v${VERSION}-UE4SS.zip"

      - name: Build GitHub Release notes
        if: steps.version.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Eqol v${VERSION}"
            echo ""
            echo "📖 **[Getting Started & Installation Guide](https://github.com/${{ github.repository }}/blob/main/docs/get-started.md)**"
            echo ""
            echo "- **MSCoreManager**: \`Eqol-v${VERSION}-MSCoreManager.zip\` (\`Mods/Eqol/\` + \`mscore.mod\`)"
            echo "- **Manual UE4SS**: \`Eqol-v${VERSION}-UE4SS.zip\` (\`Eqol/\`)"
            echo ""
            echo "## What's Changed"
            echo ""
            if [ -s CHANGELOG_RELEASE.md ]; then
              cat CHANGELOG_RELEASE.md
            else
              echo "- Maintenance and polish updates."
            fi
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Eqol v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            Eqol-v${{ steps.version.outputs.version }}-MSCoreManager.zip
            Eqol-v${{ steps.version.outputs.version }}-UE4SS.zip
          make_latest: true
